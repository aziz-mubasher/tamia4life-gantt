services:
  - type: web
    name: azm-lean-startup-roadmap
    runtime: node
    plan: free
    rootDir: .
    buildCommand: echo "skip build"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
