services:
  - type: web
    name: azm-lean-startup-roadmap
    runtime: node
    plan: free
    buildCommand: echo "No npm build required — server uses Node built-ins only"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
